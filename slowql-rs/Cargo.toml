[package]
name = "slowql"
version = "1.6.7"
edition = "2021"
authors = ["makroumi <contact@makroumi.dev>"]
description = "Next-generation SQL analyzer: Security, Performance, Compliance, Cost optimization"
license = "Apache-2.0"
repository = "https://github.com/slowql/slowql"

[[bin]]
name = "slowql"
path = "src/main.rs"

[lib]
name = "slowql_lib"
path = "src/lib.rs"

[dependencies]
sqlparser = "0.54"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
