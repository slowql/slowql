[package]
name = "slowql"
version = "1.6.7"
edition = "2021"
authors = ["makroumi <contact@makroumi.dev>"]
description = "Next-generation SQL analyzer: Security, Performance, Compliance, Cost optimization"
license = "Apache-2.0"
repository = "https://github.com/slowql/slowql"

[[bin]]
name = "slowql"
path = "src/main.rs"

[lib]
name = "slowql_lib"
path = "src/lib.rs"

[dependencies]
# SQL parsing
sqlparser = { version = "0.54", features = [] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config file parsing
toml = "0.8"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
anyhow = "1"

# Regex
regex = "1"
once_cell = "1"

# Terminal output
colored = "2"
unicode-width = "0.2"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Parallelism
rayon = "1"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Path utilities
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
