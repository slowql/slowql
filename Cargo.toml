[package]
name = "slowql"
version = "2.0.0"
edition = "2021"
authors = ["El Mehdi Makroumi <elmehdi.makroumi@gmail.com>"]
description = "Next-generation SQL static analyzer: Security, Performance, Reliability, Compliance, Cost, Quality"
license = "AGPL-3.0-only"
repository = "https://github.com/slowql/slowql"
homepage = "https://slowql.dev"
documentation = "https://slowql.dev/docs"
readme = "README.md"
keywords = ["sql", "static-analysis", "security", "performance", "linter"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/", "editors/", "assets/", ".github/"]

[[bin]]
name = "slowql"
path = "src/main.rs"

[lib]
name = "slowql_lib"
path = "src/lib.rs"

[dependencies]
sqlparser = "0.54"
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
